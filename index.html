<style>
/* ぽんこつ勇者 Web版の外枠（2026-09-25）。ゲームの見た目（夜の洞窟の紺・すりガラス・水晶の青緑・桃色の決定ボタン）に合わせた一つの暗い見た目。 */
:root {
  color-scheme: dark;
  --ground: #07060c;
  --ground-2: #0b1024;
  --ink: #eef4ff;
  --muted: #b3c1dc;
  --dim: #7d8aad;
  --glass: rgba(14, 19, 42, 0.84);
  --glass-press: rgba(28, 38, 78, 0.94);
  --edge: rgba(122, 222, 214, 0.62);
  --edge-soft: rgba(122, 222, 214, 0.24);
  --rose-top: #ffc0d2;
  --rose: #ff94b4;
  --rose-ink: #3a0f1f;
  --amber: #f3c94f;
  --sky: #8fd3ff;
  --font: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", "Yu Gothic UI", "Yu Gothic", Meiryo, system-ui, sans-serif;
  --rail-w: 76px;
}
/* 9/26 言語の切り替え：中国語・韓国語は、その言語の字形を持つ端末の字体を先に使う（日本語用の字体だと漢字が日本の字形になる） */
html[lang="zh-Hans"] { --font: "PingFang SC", "Noto Sans SC", "Noto Sans CJK SC", "Microsoft YaHei", "Source Han Sans SC", system-ui, sans-serif; }
html[lang="zh-Hant"] { --font: "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", "Microsoft JhengHei", "Source Han Sans TC", system-ui, sans-serif; }
html[lang="ko"] { --font: "Apple SD Gothic Neo", "Noto Sans KR", "Noto Sans CJK KR", "Malgun Gothic", system-ui, sans-serif; }
[hidden] { display: none !important; }
html, body {
  height: 100%;
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font);
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
#pk-stage {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(120% 90% at 30% 20%, rgba(40, 64, 120, 0.22), transparent 60%),
    radial-gradient(90% 70% at 85% 90%, rgba(110, 60, 140, 0.16), transparent 65%),
    var(--ground);
}
#pk-play {
  position: absolute;
  left: 0;
  top: 0;
  width: 320px;
  height: 180px;
  background: #07060c;
  box-shadow: 0 0 0 1px rgba(122, 222, 214, 0.10), 0 18px 60px rgba(0, 0, 0, 0.55);
}
#canvas {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  outline: none;
  touch-action: none;
}

/* ---------- 横の操作ボタン（キーボードの代わり） ---------- */
#pk-rail {
  position: absolute;
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: var(--rail-w);
  box-sizing: border-box;
  padding-block: 4px;
}
#pk-rail .pk-top {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
#pk-rail .pk-grow { flex: 1 1 auto; min-height: 4px; }
.pk-btn {
  appearance: none;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  box-sizing: border-box;
  width: 100%;
  min-height: 44px;
  padding: 6px 4px;
  border: 1px solid var(--edge-soft);
  border-radius: 14px;
  background: var(--glass);
  color: var(--ink);
  font: 700 clamp(11px, calc(var(--rail-w) * 0.17), 15px)/1.15 var(--font);
  letter-spacing: 0;
  text-align: center;
  overflow-wrap: anywhere;
  hyphens: auto;
  touch-action: none;
  cursor: pointer;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 4px 14px rgba(0, 0, 0, 0.35);
  transition: transform 80ms ease-out, background-color 120ms, border-color 120ms, opacity 160ms;
}
.pk-btn .pk-key {
  font: 400 10px/1 var(--font);
  color: var(--dim);
  letter-spacing: 0.04em;
}
.pk-btn:active, .pk-btn.pk-held {
  transform: scale(0.96);
  background: var(--glass-press);
  border-color: var(--edge);
}
.pk-btn:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
.pk-btn.pk-off { visibility: hidden; }
.pk-btn.pk-small { min-height: 34px; padding: 4px; font-size: 11px; font-weight: 400; border-radius: 11px; }
.pk-btn.pk-main { flex: 1.5 1 0; max-height: 96px; min-height: 60px; font-size: clamp(12px, calc(var(--rail-w) * 0.19), 17px); }
.pk-btn.pk-mid { flex: 1 1 0; max-height: 66px; }
.pk-btn.pk-go {
  background: linear-gradient(180deg, var(--rose-top), var(--rose));
  border-color: rgba(255, 220, 232, 0.9);
  color: var(--rose-ink);
  box-shadow: 0 0 0 1px rgba(255, 150, 185, 0.25), 0 6px 22px rgba(255, 120, 165, 0.28);
}
.pk-btn.pk-go .pk-key { color: rgba(58, 15, 31, 0.62); }
.pk-btn.pk-go:active { background: linear-gradient(180deg, #ffd1de, #ff86ab); }
.pk-btn.pk-idle { opacity: 0.55; }
.pk-btn.pk-confirm { border-color: var(--amber); color: var(--amber); }
/* 確かめの言葉（もう一度で選択へ など）は2行になるので、キーの名前は隠して、低い画面でもボタンに収める（9/26） */
.pk-btn.pk-confirm .pk-key { display: none; }
.pk-btn.pk-confirm .pk-label { white-space: pre-line; }   /* 中国語は「再按一次／返回」で折る（1字だけ次の行に残さない） */
/* 英語・スペイン語は単語の途中で折らない（入りきらない長い語だけ折る）。9/26 言語の切り替え */
html[lang="en"] .pk-btn, html[lang="es"] .pk-btn { overflow-wrap: break-word; word-break: normal; }

/* ---------- 読み込み・はじめる画面 ---------- */
#pk-boot {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 12px 16px;

.pk-card {

  background-repeat: no-repeat;

  image-rendering: pixelated;
  transform: scale(var(--hero-scale, 3));
  transform-origin: center bottom;
  margin-block: calc(32px * (var(--hero-scale, 3) - 1)) 2px;
  animation: pk-walk 0.8s steps(8) infinite;
}
@keyframes pk-walk { from { background-position: 0 0; } to { background-position: -256px 0; } }
.pk-meter {
  width: min(360px, 80%);
  height: 8px;
  border-radius: 99px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--edge-soft);
  overflow: hidden;
}
.pk-meter > i {
  display: block;
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #5fd6d0, #9ff0e6);
  box-shadow: 0 0 12px rgba(127, 224, 230, 0.6);
  transition: width 160ms linear;
}
.pk-status {
  margin: 0;
  font-size: 13px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  min-height: 1.3em;
}
.pk-start {
  appearance: none;
  border: 1px solid rgba(255, 220, 232, 0.9);
  border-radius: 999px;
  padding: 12px 34px;
  font: 700 clamp(15px, 4.4vh, 20px)/1.2 var(--font);
  letter-spacing: 0.08em;
  color: var(--rose-ink);
  background: linear-gradient(180deg, var(--rose-top), var(--rose));
  box-shadow: 0 0 0 4px rgba(255, 150, 185, 0.14), 0 10px 30px rgba(255, 120, 165, 0.3);
  cursor: pointer;
  touch-action: manipulation;
}
.pk-start:active { transform: scale(0.97); }
.pk-start:focus-visible { outline: 2px solid var(--sky); outline-offset: 3px; }
.pk-howto {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 3px 12px;
  margin: 0;
  padding: 10px 14px;
  border-radius: 14px;
  background: rgba(14, 19, 42, 0.7);
  border: 1px solid var(--edge-soft);
  font-size: clamp(11px, 2.9vh, 13px);
  line-height: 1.45;
  text-align: left;
  color: var(--muted);
}
.pk-howto dt { color: var(--ink); font-weight: 700; white-space: nowrap; }
.pk-howto dd { margin: 0; }
.pk-note { margin: 0; font-size: 11px; color: var(--dim); }
.pk-note a { color: var(--muted); text-underline-offset: 2px; }
.pk-error {
  margin: 0;
  max-width: 520px;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid rgba(255, 138, 150, 0.6);
  background: rgba(80, 20, 34, 0.55);
  color: #ffd9de;
  font-size: 13px;
  line-height: 1.5;
  text-align: left;
  white-space: pre-wrap;
  -webkit-user-select: text;
  user-select: text;
  max-height: 46vh;
  overflow: auto;
  overscroll-behavior: contain;
}

/* ---------- 縦向きのときの案内 ---------- */
#pk-rotate {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: none;
  place-items: center;
  padding: 24px 16px;
  box-sizing: border-box;
  background: linear-gradient(180deg, #0a0f24, #07060c);
  text-align: center;
}
#pk-rotate p { margin: 18px 0 0; font-size: 17px; font-weight: 700; }
#pk-rotate small { display: block; margin-top: 8px; font-size: 13px; color: var(--muted); font-weight: 400; }
.pk-phone {
  width: 46px;
  height: 78px;
  margin: 0 auto;
  border: 3px solid var(--ink);
  border-radius: 10px;
  position: relative;
  animation: pk-turn 2.4s ease-in-out infinite;
}
.pk-phone::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 5px;
  width: 12px;
  height: 3px;
  margin-left: -6px;
  border-radius: 2px;
  background: var(--edge);
}
@keyframes pk-turn { 0%, 25% { transform: rotate(0deg); } 55%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (pointer: coarse) {
  #pk-rotate { display: grid; }
}

/* ---------- 小窓（外のページへのリンク。9/26 ランキングを外したので、クリアログの保存の窓は削除） ---------- */
#pk-sheet {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: grid;
  place-items: center;
  padding: 16px;
  box-sizing: border-box;
  background: rgba(3, 4, 10, 0.66);
}
#pk-sheet[hidden] { display: none !important; }
.pk-dialog {
  display: grid;
  gap: 12px;
  width: min(460px, 100%);
  max-height: 100%;
  overflow: auto;
  box-sizing: border-box;
  padding: 18px 18px 16px;
  border-radius: 18px;
  border: 1px solid var(--edge);
  background: rgba(12, 17, 38, 0.97);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
}
.pk-dialog h2 { margin: 0; font-size: 17px; letter-spacing: 0.04em; }
.pk-dialog p { margin: 0; font-size: 13px; line-height: 1.6; color: var(--muted); }
.pk-dialog .pk-url {
  font-size: 12px;
  color: var(--sky);
  overflow-wrap: anywhere;
  -webkit-user-select: text;
  user-select: text;
}
.pk-row { display: flex; flex-wrap: wrap; gap: 10px; }
.pk-act {
  appearance: none;
  flex: 1 1 140px;
  min-height: 44px;
  padding: 10px 14px;
  border-radius: 12px;
  border: 1px solid var(--edge-soft);
  background: var(--glass);
  color: var(--ink);
  font: 700 14px/1.2 var(--font);
  text-align: center;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  touch-action: manipulation;
}
.pk-act.pk-go { background: linear-gradient(180deg, var(--rose-top), var(--rose)); color: var(--rose-ink); border-color: rgba(255, 220, 232, 0.9); }
.pk-act:active { transform: scale(0.98); }
.pk-act:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
/* ---------- ホーム画面に追加の案内（iPhone・iPad の Safari で開いたときだけ。9/26 作者の依頼） ---------- */
.pk-a2hs {
  position: absolute;
  top: 10px;
  right: 12px;
  z-index: 2;
  appearance: none;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 12px 7px 9px;
  white-space: nowrap;
  border-radius: 14px;
  border: 1px solid var(--edge);
  background: linear-gradient(180deg, rgba(24, 44, 78, 0.95), rgba(12, 17, 38, 0.95));
  box-shadow: 0 0 0 3px rgba(122, 222, 214, 0.10), 0 8px 24px rgba(0, 0, 0, 0.45);
  color: var(--ink);
  font: 700 12px/1.3 var(--font);
  text-align: left;
  cursor: pointer;
  touch-action: manipulation;
  animation: pk-a2hs-in 0.5s ease-out both;
}
.pk-a2hs[hidden] { display: none !important; }
.pk-a2hs small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
.pk-a2hs.pk-compact small { display: none; }
.pk-a2hs svg { flex: 0 0 auto; width: 26px; height: 26px; }
.pk-a2hs:active { transform: scale(0.98); }
.pk-a2hs:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
@keyframes pk-a2hs-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.pk-steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; counter-reset: pk-step; }
.pk-steps li {
  display: grid;
  grid-template-columns: 22px 30px 1fr;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  line-height: 1.5;
  color: var(--ink);
}
.pk-steps li::before {
  counter-increment: pk-step;
  content: counter(pk-step);
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--edge-soft);
  color: var(--ink);
  font-weight: 700;
  font-size: 12px;
}
.pk-steps svg, .pk-steps img { width: 30px; height: 30px; border-radius: 7px; }
.pk-steps small { display: block; color: var(--muted); font-size: 11px; }
.pk-dialog .pk-fine { font-size: 11px; color: var(--dim); }
@media (prefers-reduced-motion: reduce) {
  .pk-a2hs { animation: none; }
  .pk-hero, .pk-phone { animation: none; }
  .pk-btn, .pk-meter > i { transition: none; }
}
</style>

<div id="pk-stage">
  <div id="pk-play">
    <canvas id="canvas" tabindex="-1">このブラウザでは表示できません。</canvas>

  function pickLang() {

    const l = String(navigator.language || 'ja').toLowerCase().replace('-', '_');
    if (l.startsWith('ja')) return 'ja';
    if (l.startsWith('zh')) return /tw|hk|mo|hant/.test(l) ? 'zh_TW' : 'zh_CN';
    if (l.startsWith('ko')) return 'ko';
    if (l.startsWith('es')) return 'es';
    return 'en';
  }

    }
    return s;
  }


  // ---------------------------------------------------------------- 並べ方
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;' +

  document.body.appendChild(probe);
  function insets() {
    const cs = getComputedStyle(probe);
    return {
      t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0,
      b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0,
    };
  }
  function layout() {
    const W = window.innerWidth;
    const H = window.innerHeight;
    const ins = insets();
    const edge = 6;
    const gap = 8;
    const RAIL_MIN = 64;
    const RAIL_MAX = 100;
    const roomW = Math.max(200, W - ins.l - ins.r - edge * 2);
    const roomH = Math.max(90, H - ins.t - ins.b - edge * 2);
    // まず高さいっぱいの 16:9。横に余りがあれば操作ボタンの列を太くし、足りなければ絵を小さくする
    let gh = roomH;
    let gw = gh * 16 / 9;
    if (gw + gap + RAIL_MIN > roomW) {
      gw = roomW - gap - RAIL_MIN;
      gh = gw * 9 / 16;
    }
    gw = Math.floor(gw);
    gh = Math.floor(gh);
    const railW = Math.floor(Math.max(RAIL_MIN, Math.min(RAIL_MAX, roomW - gw - gap)));
    const groupW = gw + gap + railW;
    const x0 = Math.round(ins.l + edge + Math.max(0, (roomW - groupW) / 2));
    const y0 = Math.round(ins.t + edge + Math.max(0, (roomH - gh) / 2));
    play.style.left = x0 + 'px';
    play.style.top = y0 + 'px';
    play.style.width = gw + 'px';
    play.style.height = gh + 'px';
    stage.style.setProperty('--rail-w', railW + 'px');
    const railH = Math.min(roomH, Math.max(gh, 300));
    rail.style.left = (x0 + gw + gap) + 'px';
    rail.style.top = Math.round(ins.t + edge + Math.max(0, (roomH - railH) / 2)) + 'px';
    rail.style.height = railH + 'px';
    let dpr = Math.min(window.devicePixelRatio || 1, DPR_CAP);
    if (dpr > 2) {
      dpr = Math.max(2, Math.min(dpr, Math.sqrt(HI_DPR_PIXELS / Math.max(1, gw * gh))));
    }
    const cw = Math.max(2, Math.round(gw * dpr));
    const ch = Math.max(2, Math.round(gh * dpr));
    if (canvas.width !== cw || canvas.height !== ch) {
      canvas.width = cw;
      canvas.height = ch;
    }
    const heroScale = Math.max(2, Math.min(5, Math.floor(gh / 110)));
    boot.style.setProperty('--hero-scale', String(heroScale));
    fitChip();
  }

  }
  function setMeter(frac) {
    const pct = Math.max(0, Math.min(100, Math.round(frac * 100)));
    meterFill.style.width = pct + '%';
    meter.setAttribute('aria-valuenow', String(pct));
  }
  function showError(message, detail) {
    errorEl.hidden = false;
    errorEl.textContent = message + (detail ? '\n\n' + detail : '');
    startBtn.hidden = true;
    meter.hidden = true;
    // 小さい横画面でも知らせが隠れないように、遊び方の説明はしまう
    $('pk-howto').hidden = true;
    $('pk-note').hidden = true;
    setStatus(null);
    document.querySelector('.pk-hero').style.animationPlayState = 'paused';
  }

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = () => reject(new Error(t('cantLoad') + src));
      document.head.appendChild(s);
    });
  }
  async function fetchParts(parts, onBytes) {
    const chunks = [];
    for (const p of parts) {
      const res = await fetch(p.url, { cache: 'force-cache' });
      if (!res.ok) {
        throw new Error(t('cantLoadFile', { url: p.url, status: res.status }));
      }
      if (res.body && res.body.getReader) {
        const reader = res.body.getReader();
        for (;;) {
          const r = await reader.read();
          if (r.done) {
            break;
          }
          chunks.push(r.value);
          onBytes(r.value.byteLength);
        }
      } else {
        const b = new Uint8Array(await res.arrayBuffer());
        chunks.push(b);
        onBytes(b.byteLength);
      }
    }
    return new Blob(chunks);
  }
  async function gunzip(blob) {
    // 配信側が gzip をすでに解いて渡してきたときは、そのまま使う（大きさはあとで確かめる）
    const head = new Uint8Array(await blob.slice(0, 2).arrayBuffer());
    if (head[0] !== 0x1f || head[1] !== 0x8b) {
      return await blob.arrayBuffer();
    }
    if (typeof DecompressionStream === 'function') {
      const stream = blob.stream().pipeThrough(new DecompressionStream('gzip'));
      return await new Response(stream).arrayBuffer();
    }
    if (typeof window.fflate === 'undefined') {
      await loadScript('https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js');
    }
    const out = window.fflate.gunzipSync(new Uint8Array(await blob.arrayBuffer()));
    return out.buffer.slice(out.byteOffset, out.byteOffset + out.byteLength);
  }

  // WebAssembly を動かしてよい表示環境かを、23MB を読み込む前に確かめる（8バイトの空のモジュールを試しに作る）
  async function wasmProblem() {
    if (typeof WebAssembly !== 'object' || typeof WebAssembly.compile !== 'function') {
      return t('noWasm');
    }
    try {
      await WebAssembly.compile(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0]));
      return '';
    } catch (e) {
      return String(e && e.message || e);
    }
  }

  let started = false;
  let engine = null;
  const exe = GODOT_CONFIG.executable || 'index';

  async function prepare() {
    const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
    if (missing.length) {
      showError(t('errBrowser'), missing.join('\n') + '\n\n' + t('errBrowserHint'));
      return;
    }
    if (!PK_FILES) {
      showError(t('errNoList'), t('errNoListHint'));
      return;
    }
    const blocked = await wasmProblem();
    if (blocked) {
      showError(t('errEnv'), t('errEnvBlocked') + '\n' + blocked + '\n\n' + t('errEnvHint'));
      return;
    }
    const total = PK_FILES.wasm.parts.concat(PK_FILES.pck.parts).reduce((a, p) => a + p.size, 0);
    let got = 0;
    const onBytes = (n) => {
      got += n;
      setMeter(got / total * 0.9);
      setStatus('loadingPct', { p: Math.min(100, Math.floor(got / total * 100)), mb: (total / 1048576).toFixed(0) });
    };
    setStatus('loading0');
    const [wasmGz, pckGz] = await Promise.all([fetchParts(PK_FILES.wasm.parts, onBytes), fetchParts(PK_FILES.pck.parts, onBytes)]);
    setStatus('unpack');
    const [wasmBuf, pckBuf] = await Promise.all([gunzip(wasmGz), gunzip(pckGz)]);
    if (wasmBuf.byteLength !== PK_FILES.wasm.size || pckBuf.byteLength !== PK_FILES.pck.size) {
      throw new Error(t('truncated'));
    }
    setMeter(0.94);
    // 本体（wasm）はここで用意したものを渡す（Godot の読み込みは fetch で index.wasm を取りに来る）
    let wasmForEngine = wasmBuf;
    const realFetch = window.fetch.bind(window);
    window.fetch = function (input, init) {
      const url = typeof input === 'string' ? input : (input && input.url) || '';
      if (wasmForEngine && url.split('?')[0].endsWith(exe + '.wasm')) {
        const body = wasmForEngine;
        wasmForEngine = null;
        return Promise.resolve(new Response(body, { status: 200, headers: { 'Content-Type': 'application/wasm' } }));
      }
      return realFetch(input, init);
    };
    setStatus('boot');
    engine = new Engine(Object.assign({}, GODOT_CONFIG, { canvas: canvas }));
    // Godot の読み込み処理は WebAssembly の失敗（メモリ不足など）を拾わずに止まるので、ここで拾って知らせる
    let onReject = null;
    const failed = new Promise((resolve, reject) => {
      onReject = (ev) => {
        const r = ev.reason;
        const text = String(r && r.message || r);
        if (/wasm|WebAssembly|CompileError|LinkError|RuntimeError|unsafe-eval|memory|allocate/i.test(text)) {
          ev.preventDefault();
          reject(r instanceof Error ? r : new Error(text));
        }
      };
      window.addEventListener('unhandledrejection', onReject);
    });
    const slow = setTimeout(() => setStatus('bootSlow'), 15000);
    try {
      await Promise.race([engine.init(exe), failed]);
    } finally {
      clearTimeout(slow);
      window.removeEventListener('unhandledrejection', onReject);
      window.fetch = realFetch;
    }
    await engine.preloadFile(pckBuf, exe + '.pck');
    setMeter(1);
    setStatus(null);
    meter.hidden = true;
    startBtn.hidden = false;
    startBtn.focus({ preventScroll: true });
  }

  function start() {
    if (started || !engine) {
      return;
    }
    started = true;
    enterFullscreen();
    startBtn.hidden = true;
    $('pk-howto').hidden = true;
    $('pk-note').hidden = true;
    setStatus('starting');
    engine.start({
      args: ['--main-pack', exe + '.pck'],
      canvas: canvas,
      onExit: () => {
        boot.hidden = false;
        showError(t('ended'), t('endedHint'));
      },
    }).then(() => {
      updateFullButton();
      refocus();
      setTimeout(() => { if (!gameReady) boot.hidden = true; }, 12000);
    }, (err) => {
      boot.hidden = false;
      showError(t('cantStart'), String(err && err.message || err));
    });
  }
  let chipMode = 'ios';
  function applyChip() {
    $('pk-a2hs-text').replaceChildren(document.createTextNode(t('chipIos')), el('small', {}, t(chipMode === 'android' ? 'chipAndroidSub' : 'chipIosSub')));
    fitChip();
  }
  function applyLang() {
    document.documentElement.lang = HTML_LANG[lang] || 'ja';
    document.title = t('title');
    canvas.textContent = t('canvas');
    document.querySelector('.pk-title').textContent = t('title');
    meter.setAttribute('aria-label', t('loading'));
    if (statusKey) {
      statusEl.textContent = t(statusKey, statusVars);
    }
    const coarse = !window.matchMedia || window.matchMedia('(pointer: coarse)').matches;
    startBtn.textContent = t(coarse ? 'tapStart' : 'clickStart');
    const howto = $('pk-howto');
    howto.replaceChildren();
    [['tap', 'tapDo'], ['swipe', 'swipeDo'], ['two', 'twoDo'], ['rightBtns', 'rightDo']].forEach((pair) => {
      howto.appendChild(el('dt', {}, t(pair[0])));
      howto.appendChild(el('dd', {}, t(pair[1])));
    });
    const note = $('pk-note');
    note.replaceChildren(document.createTextNode(t(standalone ? 'noteApp' : 'noteBrowser') + (lang === 'en' || lang === 'es' ? '  ' : '　')),
      el('a', { href: 'THIRD_PARTY_LICENSES.txt', target: '_blank', rel: 'noopener' }, t('licenses')),
      document.createTextNode(lang === 'ja' ? '・' : ' · '),   // 「・」は日本語だけ（中国語・韓国語は「·」）
      el('a', { href: 'NOTO_OFL.txt', target: '_blank', rel: 'noopener' }, t('font')));
    rail.setAttribute('aria-label', t('rail'));
    btn.fit.textContent = t('fit');
    updateFullButton();
    [[btn.back, 'back'], [btn.retry, 'retry'], [btn.fast, 'fast'], [btn.go, 'go']].forEach((pair) => {
      if (pair[0].classList.contains('pk-off')) {
        pair[0].querySelector('.pk-label').textContent = t(pair[1]);
      }
    });
    btn.go.querySelector('.pk-key').textContent = t('space');
    const rot = document.querySelector('#pk-rotate p');
    rot.replaceChildren(document.createTextNode(t('rotate')), el('small', {}, t('rotateSub')));
    applyChip();
  }
  let gameReady = false;
  window.pkReady = function () {
    gameReady = true;
    boot.hidden = true;
    layout();
    refocus();
  };
  // ---------------------------------------------------------------- ホーム画面に追加の案内（9/26 作者の依頼）
  // iPhone・iPad の Safari では、ホーム画面のアイコンから開くと全画面になり、スワイプやピンチが Safari の操作とぶつからない。
  // Safari で開いたときだけ、はじめる画面の右上に案内を出し、最初に「はじめる」を押したときに一度だけ手順の小窓を出す。
  // ホーム画面から開いたとき・ほかのページの中（アーティファクトなど）で開いたときは出さない。
  const ua = navigator.userAgent || '';
  const isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const mq = (q) => !!(window.matchMedia && window.matchMedia(q).matches);
  const standalone = navigator.standalone === true || mq('(display-mode: standalone)') || mq('(display-mode: fullscreen)') || mq('(display-mode: minimal-ui)');
  let embedded = true;
  try {
    embedded = window.top !== window.self;
  } catch (e) {
    embedded = true;
  }
  const guideIOS = isIOS && !standalone && !embedded;
  const a2hsChip = $('pk-a2hs');
  const A2HS_KEY = 'pk-a2hs-shown';
  function storeGet(k) {
    try { return window.localStorage.getItem(k); } catch (e) { return null; }
  }
  function storeSet(k, v) {
    try { window.localStorage.setItem(k, v); } catch (e) { /* 保存できない表示環境。毎回出るだけ */ }
  }
  // はじめる画面の注意書き（ホーム画面から開いたときは「このアプリに保存」）は applyLang が書く
  const ICON_SHARE = '<svg viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="7" fill="#1b2a52"/><path d="M15 6.5v10M11 10.5l4-4 4 4" fill="none" stroke="#8fd3ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 14.5h-1.5A1.5 1.5 0 0 0 8 16v6a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 22 22v-6a1.5 1.5 0 0 0-1.5-1.5H19" fill="none" stroke="#8fd3ff" stroke-width="2" stroke-linecap="round"/></svg>';
  const ICON_ADD = '<svg viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="7" fill="#1b2a52"/><rect x="7.5" y="7.5" width="15" height="15" rx="3.5" fill="none" stroke="#8fd3ff" stroke-width="2"/><path d="M15 11v8M11 15h8" stroke="#8fd3ff" stroke-width="2" stroke-linecap="round"/></svg>';
  function step(list, iconHtml, main, sub) {
    const li = el('li');
    li.insertAdjacentHTML('beforeend', iconHtml);
    const t = el('span', {}, main);
    if (sub) {
      t.appendChild(el('small', {}, sub));
    }
    li.appendChild(t);
    list.appendChild(li);
  }
  function a2hsSheet(fromStart) {
    storeSet(A2HS_KEY, '1');
    openSheet((d) => {
      d.appendChild(el('h2', { id: 'pk-sheet-title' }, t('a2hsTitle')));
      d.appendChild(el('p', {}, t('a2hsBody')));
      const ol = el('ol', { class: 'pk-steps' });
      step(ol, ICON_SHARE, t('step1'), t('step1Sub'));
      step(ol, ICON_ADD, t('step2'), t('step2Sub'));
      step(ol, '<img src="index.apple-touch-icon.png" alt="">', t('step3'), '');
      d.appendChild(ol);
      d.appendChild(el('p', { class: 'pk-fine' }, t('a2hsFine')));
      const row = el('div', { class: 'pk-row' });
      if (fromStart) {
        const go = el('button', { type: 'button', class: 'pk-act pk-go' }, t('playNow'));
        go.addEventListener('click', () => { closeSheet(); start(); });
        row.appendChild(go);
        const later = el('button', { type: 'button', class: 'pk-act' }, t('addFirst'));
        later.addEventListener('click', closeSheet);
        row.appendChild(later);
      } else {
        closeButton(row);
      }
      d.appendChild(row);
    });
  }
  // Android の Chrome などは、その場で「ホーム画面に追加」の確認を出せる
  let installPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    // スマホ・タブレットだけ（パソコンの Chrome はアドレスバーの「インストール」に任せる）
    if (embedded || standalone || !mq('(pointer: coarse)')) {
      return;
    }
    e.preventDefault();
    installPrompt = e;
    chipMode = 'android';
    applyChip();
    a2hsChip.hidden = false;
    fitChip();
  });
  window.addEventListener('appinstalled', () => { a2hsChip.hidden = true; });
  a2hsChip.addEventListener('click', () => {
    if (installPrompt) {
      const p = installPrompt;
      installPrompt = null;
      try {
        p.prompt();
        Promise.resolve(p.userChoice).finally(() => { a2hsChip.hidden = true; });
      } catch (e) {
        a2hsChip.hidden = true;
      }
      return;
    }
    a2hsSheet(false);
  });
  if (guideIOS) {
    a2hsChip.hidden = false;
    fitChip();
  }
  startBtn.addEventListener('click', () => {
    if (guideIOS && !storeGet(A2HS_KEY)) {
      a2hsSheet(true);
      return;
    }
    start();
  });
  // 言語：はじめる画面・横のボタンの言葉を書く。ゲームが始まったら、ゲームの言語に合わせる（pkLang）
  lang = pickLang();
  applyLang();
  window.pkLang = function (code) {
    if (LANGS.indexOf(code) < 0) {
      return;
    }
    storeSet(LANG_KEY, code);
    if (code !== lang) {
      lang = code;
      applyLang();
    }
  };
  window.pkDebug = { layout: layout, get engine() { return engine; }, get started() { return started; } };

  prepare().catch((err) => {
    console.error(err);
    const text = String(err && err.message || err);
    let hint = t('hintReload');
    if (/memory|allocate/i.test(text)) {
      hint = t('hintMemory');
    } else if (/wasm|WebAssembly|CompileError|unsafe-eval/i.test(text)) {
      hint = t('hintWasm');
    }
    showError(t('loadFailed'), text + '\n\n' + hint);
  });
}());
</script>
